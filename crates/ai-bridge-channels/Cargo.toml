[package]
name = "ai-bridge-channels"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
nix = { version = "0.29", features = ["socket", "uio", "user"] }

# Test-only helper binary used by the SO_PEERCRED subprocess regression tests.
[[bin]]
name = "channel_test_client"
path = "src/bin/channel_test_client.rs"

[dev-dependencies]
tempfile = "3.0"
nix = { version = "0.29", features = ["socket", "uio", "user"] }
