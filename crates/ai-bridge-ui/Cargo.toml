[package]
name = "ai-bridge-ui"
version = "0.1.0"
edition = "2021"
description = "AI-Bridge Operator Dashboard — policy/config management UI"
license = "MIT"

[dependencies]
ai-bridge-channels = { path = "../ai-bridge-channels" }
ai-bridge-gatekeeper-core = { path = "../ai-bridge-gatekeeper-core" }
ai-bridge-gatekeeper-daemon = { path = "../ai-bridge-gatekeeper-daemon" }
ai-bridge-hand-eye = { path = "../ai-bridge-hand-eye" }
ai-bridge-protocol = { path = "../ai-bridge-protocol" }
eframe = "0.29"
egui = "0.29"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# ---------------------------------------------------------------------------
# cargo-deb packaging config. Produces a .deb that installs the daemon + UI
# into a dedicated application directory (/opt/ai-bridge) rather than /usr/bin.
#   cargo install cargo-deb
#   cargo deb --manifest-path crates/ai-bridge-ui/Cargo.toml
# ---------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "AI-Bridge Team <maintainers@example.com>"
section = "utils"
priority = "optional"
extended-description = """AI-Bridge Operator Dashboard — a safety/policy gatekeeper for
orchestrating AI-driven task execution, shipped with a full desktop admin UI.
Installs the daemon and UI into /opt/ai-bridge and seeds (never overwrites)
the user config directory."""
depends = "$auto"
assets = [
    ["../../target/release/ai-bridge", "opt/ai-bridge/", "755"],
    ["../../target/release/ai-bridge-ui", "opt/ai-bridge/", "755"],
    ["../../config/*", "etc/ai-bridge/", "644"],
]
maintainer-scripts = "../../packaging/linux/"
conf-files = []
